<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Stackly</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Link same stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--text-light);
      padding: 40px 24px;
    }
    
    .error-container {
      max-width: 600px;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 60px 40px;
      border-radius: var(--border-radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-lg);
    }
    
    .error-icon {
      font-size: 5rem;
      color: var(--accent);
      margin-bottom: 24px;
      animation: float 4s ease-in-out infinite;
    }
    
    .error-code {
      font-family: var(--font-heading);
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 16px;
      color: var(--text-light);
    }
    
    .error-message {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-light);
    }
    
    .error-desc {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 40px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  
  <div class="error-page-wrapper">
    <div class="error-container">
      <div class="error-icon">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <h1 class="error-code">404</h1>
      <h2 class="error-message">Shipment Lost in Transit</h2>
      <p class="error-desc">We couldn't find the page you were looking for. The URL might have changed, or the page was temporarily moved.</p>
      <a href="index.html" class="btn btn-primary">
        <i class="fas fa-home"></i> Back to Homepage
      </a>
    </div>
  </div>

</body>
</html>
